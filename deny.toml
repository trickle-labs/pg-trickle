[graph]
all-features = true

[licenses]
# Allow the standard permissive and weak-copyleft open-source licenses used
# across the dependency tree. Unicode-3.0 is required by the icu_* crates;
# BSL-1.0 is used by Boost-derived crates pulled in by pgrx internals.
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
]

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Owner: geir-gronmo
  # Added: 2026-05-22
  # Review-By: 2026-11-23
  # Upstream: https://github.com/pyfisch/cbor/issues/172
  # Remove-When: transitive dep chain updated to use ciborium
  # serde_cbor is pulled in transitively (dev path). Not a security vulnerability,
  # only unmaintained. Use of ciborium is the upstream recommendation but we
  # have no direct control over this dep.
  "RUSTSEC-2021-0127",
  # Owner: geir-gronmo
  # Added: 2026-06-01
  # Review-By: 2026-09-01
  # Upstream: https://github.com/RustCrypto/RSA/issues/19
  # Remove-When: sqlx-mysql updates to rsa >=0.9.8 or pg_trickle removes MySQL feature
  # rsa Marvin Attack (RUSTSEC-2023-0071) — pulled in transitively via
  # sqlx -> sqlx-mysql -> rsa, but pg_trickle only enables the "postgres"
  # feature of sqlx. sqlx-mysql is never compiled into the extension binary.
  # Suppress until upstream provides a patched rsa crate.
  "RUSTSEC-2023-0071",
  # Owner: geir-gronmo
  # Added: 2026-06-01
  # Review-By: 2026-09-01
  # Upstream: https://github.com/hickory-dns/hickory-dns/issues/2630
  # Remove-When: hickory-dns 0.26.1 released and propagated through deps
  # RUSTSEC-2026-0118: hickory-proto NSEC3 unbounded DoS loop (0.26.0).
  # RUSTSEC-2026-0119: hickory-proto O(n²) name compression (0.26.0).
  # RUSTSEC-2026-0120: hickory-dns network-reachable panic (0.26.0).
  # These are only transitive test dependencies via sqlx integration tests;
  # not reachable from the pg_trickle extension in production.
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",
  "RUSTSEC-2026-0120",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# These duplicate versions come from pgrx pulling one version and
# testcontainers/bollard pulling another. We have no direct control over these
# version skews; they are dev-only or cross-compilation stubs.
skip = [
  # thiserror: pgrx uses v1, our code and testcontainers use v2
  { name = "thiserror",      version = "=1.0.69" },
  { name = "thiserror-impl", version = "=1.0.69" },
  # getrandom: split between pgrx (0.3) and newer crates (0.4)
  { name = "getrandom", version = "=0.3.4" },
  # hashbrown: multiple major versions pulled by indexmap and others
  { name = "hashbrown", version = "=0.15.5" },
  # foldhash: 0.1.x from hashbrown (via pgrx/petgraph) vs 0.2.x from newer hashbrown (via sqlx)
  { name = "foldhash", version = "=0.1.5" },
  # wasi: 0.11 from older crates, 0.14 from newer wasmtime-based stack
  { name = "wasi", version = "=0.11.1+wasi-snapshot-preview1" },
  # windows-* crates: version skew between ring (0.52) and socket2/hyper-util
  # (0.53+) pulled by bollard/testcontainers
  { name = "windows-core",      version = "=0.57.0" },
  { name = "windows-implement", version = "=0.57.0" },
  { name = "windows-interface", version = "=0.57.0" },
  { name = "windows-result",    version = "=0.1.2"  },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
