name: DVM deep tiers (COR-18)

# COR-18 (v0.87.6): bounded pull-request DVM jobs already run in ci.yml's
# e2e-smoke job (corpus, composition, metamorphic, strategy, failpoint,
# negative-control, light typed-generator sample). This workflow adds the
# deeper, scheduled tiers on top of that PR gate:
#
#   nightly  - a bounded subset for fast trend feedback. Reruns the same
#              corpus/composition/metamorphic/shrink checks the PR gate runs,
#              but skips e2e_dvm_strategy_tests (the most expensive suite
#              here, since it replays the full corpus across CDC-mode and
#              refresh-mode variants).
#   weekly   - the full deep suite (adds strategy, failpoint, and negative
#              control checks) plus an extended 1800s/target cargo-fuzz run
#              (see fuzz-nightly.yml for the 300s/target nightly budget this
#              extends), on a longer schedule (Monday mornings).
#
# Both tiers finish with a fast, no-database structural pass of
# scripts/dvm_release_gate.py (composition-matrix, coverage-floors,
# corpus-retention, shrink-selftest) as a release-gate sanity check; the
# live-database steps of that same gate are exercised here as ordinary
# cargo nextest steps instead, mirroring ci.yml's e2e-smoke job.

on:
  schedule:
    - cron: '30 2 * * *'   # Nightly at 02:30 UTC — bounded subset
    - cron: '0 4 * * 1'    # Weekly, Monday 04:00 UTC — full deep suite
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to run'
        type: choice
        options:
          - nightly
          - weekly
        default: nightly

concurrency:
  group: dvm-tiers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dvm-deep:
    name: DVM deep tier
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Determine tier
        id: tier
        run: |
          case "${{ github.event.schedule }}" in
            '30 2 * * *') echo "tier=nightly" >> "$GITHUB_OUTPUT" ;;
            '0 4 * * 1')  echo "tier=weekly" >> "$GITHUB_OUTPUT" ;;
            *)            echo "tier=${{ inputs.tier || 'nightly' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
               "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          docker system prune -af

      - uses: actions/checkout@v7

      - name: Setup pgrx environment
        uses: ./.github/actions/setup-pgrx

      - name: Restore Docker image cache (postgres:18.3)
        uses: actions/cache@v6
        id: cache-docker-postgres-dvm
        with:
          path: /tmp/docker-images/postgres-18.3.tar
          key: docker-postgres-18.3

      - name: Load or pull postgres:18.3
        run: |
          if [ -f /tmp/docker-images/postgres-18.3.tar ]; then
            docker load --input /tmp/docker-images/postgres-18.3.tar
          else
            docker pull postgres:18.3
            mkdir -p /tmp/docker-images
            docker save postgres:18.3 --output /tmp/docker-images/postgres-18.3.tar
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        continue-on-error: true  # GHCR login is optional (cache pull only); transient timeouts must not fail the job
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull builder image from GHCR
        run: |
          # Pull the pre-built builder image to avoid a ~30-60 min local build.
          # Falls back to building locally if the GHCR image is unavailable.
          if docker pull ghcr.io/trickle-labs/pg-trickle/builder:pg18 2>/dev/null; then
            docker tag ghcr.io/trickle-labs/pg-trickle/builder:pg18 pg_trickle_builder:pg18
            echo "Builder image pulled from GHCR — skipping local build"
          else
            echo "::warning::Builder image not in GHCR (first run?). Will build locally."
          fi

      - name: Build E2E Docker image
        run: ./tests/build_e2e_image.sh

      - name: Run DVM regression corpus
        run: cargo nextest run --profile ci --test e2e_dvm_corpus_tests --no-capture

      - name: Run DVM composition matrix
        run: cargo nextest run --profile ci --test e2e_dvm_composition_tests --no-capture

      - name: Run DVM metamorphic checks
        run: cargo nextest run --profile ci --test e2e_dvm_metamorphic_tests --no-capture

      - name: Run DVM shrink regression tests
        run: cargo nextest run --profile ci --test e2e_dvm_shrink_tests --no-capture

      # Weekly-only: replays the corpus across CDC-mode and refresh-mode
      # strategy variants, the refresh failpoint, and the active
      # negative-control corpus. Skipped on nightly to keep the
      # trend-feedback budget bounded, per COR-18.
      - name: Run DVM strategy and CDC-mode variants (weekly only)
        if: steps.tier.outputs.tier == 'weekly'
        run: cargo nextest run --profile ci --test e2e_dvm_strategy_tests --no-capture

      - name: Run DVM refresh failpoint (weekly only)
        if: steps.tier.outputs.tier == 'weekly'
        run: cargo nextest run --profile ci --test e2e_dvm_failpoint_tests --no-capture

      - name: Run DVM active negative controls (weekly only)
        if: steps.tier.outputs.tier == 'weekly'
        run: cargo nextest run --profile ci --test e2e_dvm_negative_control_tests --no-capture

      - name: Run DVM release gate (structural steps only, no live database)
        run: python3 scripts/dvm_release_gate.py

      - name: Upload DVM artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dvm-tiers-artifacts-${{ github.run_id }}
          path: artifacts/dvm-fuzz/
          if-no-files-found: ignore
          retention-days: 30

  dvm-deep-fuzz:
    name: Extended weekly fuzz run (1800 s/target)
    runs-on: ubuntu-latest
    # Only meaningful on the weekly cron; workflow_dispatch with tier=nightly
    # skips it to keep manual nightly-tier runs fast.
    if: github.event.schedule == '0 4 * * 1' || inputs.tier == 'weekly'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Setup pgrx environment (with nightly Rust for cargo-fuzz)
        uses: ./.github/actions/setup-pgrx
        with:
          rust-toolchain: nightly
          pg-version: "18"
          pg-install-mode: system

      - name: Cache cargo registry and fuzz build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-weekly-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml', 'Cargo.toml') }}
          restore-keys: |
            fuzz-weekly-${{ runner.os }}-
            fuzz-nightly-${{ runner.os }}-
            fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Extended weekly fuzz run (1800 s per target)
        env:
          FUZZ_SECONDS: '1800'
          FUZZ_WEEKLY_CASES: ${{ vars.FUZZ_WEEKLY_CASES || '5000' }}
          FUZZ_SEED: '8503'
        run: |
          set -euo pipefail
          mapfile -t TARGETS < <(python3 scripts/fuzz_targets.py)
          test "${#TARGETS[@]}" -gt 0
          test "${FUZZ_WEEKLY_CASES}" -ge 1
          echo "fuzz seed=${FUZZ_SEED} required_cases=${FUZZ_WEEKLY_CASES} targets=${#TARGETS[@]}"
          for TARGET in "${TARGETS[@]}"; do
            echo "=== Fuzzing $TARGET for ${FUZZ_SECONDS}s ==="
            CORPUS_DIR="fuzz/corpus/$TARGET"
            if [ -d "$CORPUS_DIR" ]; then
              CORPUS_ARGS=("$CORPUS_DIR")
            else
              echo "No corpus for $TARGET — using bounded seed fuzz"
              CORPUS_ARGS=()
            fi
            cargo fuzz run "$TARGET" "${CORPUS_ARGS[@]}" -- -max_total_time="${FUZZ_SECONDS}" -runs="${FUZZ_WEEKLY_CASES}" -seed="${FUZZ_SEED}" 2>&1 || {
              echo "FAIL: $TARGET found a crash during the weekly deep fuzz run"
              exit 1
            }
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-weekly-crashes-${{ github.run_id }}
          path: |
            fuzz/artifacts/
          retention-days: 90
