name: pgvector compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-extension:
    name: PostgreSQL 18 / pgvector ${{ matrix.pgvector }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pgvector: ["0.8.1", "0.8.7"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pgrx
      - name: Pull builder image when available
        run: |
          if docker pull ghcr.io/trickle-labs/pg-trickle/builder:pg18 2>/dev/null; then
            docker tag ghcr.io/trickle-labs/pg-trickle/builder:pg18 pg_trickle_builder:pg18
          fi
      - name: Build packaged extension and pgvector image
        env:
          PGVECTOR_VERSION: ${{ matrix.pgvector }}
        run: |
          ./tests/build_e2e_image.sh
          ./tests/build_e2e_pgvector_image.sh "$PGVECTOR_VERSION"
      - name: Run bounded installed-extension conformance
        env:
          PGVECTOR_EXPECTED_VERSION: ${{ matrix.pgvector }}
          PGS_E2E_IMAGE: pg_trickle_e2e_pgvector:${{ matrix.pgvector }}
        run: |
          ./scripts/run_e2e_tests.sh --retries 0 --test-threads 2 \
            --test e2e_pgvector_tests --test e2e_pgvector_hybrid_tests --test e2e_pgvector_revision_tests \
            -E 'test(test_pgvector_compat_installed_version) | test(test_pgvector_helper_missing_extension_is_actionable_and_atomic) | test(test_pgvector_helper_invalid_column_is_actionable_and_atomic) | test(test_pgvector_helper_dry_run_rejects_invalid_legacy_columns) | test(test_vector_aggregate_disabled_reports_actionable_error) | test(test_vector_aggregate_nonpublic_extension_schema) | test(test_vector_aggregate_mode_change_uses_saved_path_and_admission_setting) | test(test_vector_aggregate_join_uses_each_bound_dimension) | test(test_vector_aggregate_qualified_join_uses_argument_type) | test(test_vector_aggregate_cast_uses_cast_type) | test(test_vector_aggregate_normalized_expression_keeps_unknown_dimension) | test(test_vector_aggregate_cte_alias_and_group_key_changes) | test(test_centroid_cost_model_accepts_real_refresh_history) | test(test_centroid_cost_model_rescans_and_rebinds_safely) | test(test_centroid_numerical_guard_reports_rebase_reasons) | test(test_centroid_crash_recovers_committed_source_and_rolls_back_refresh) | test(test_centroid_refresh_serializes_concurrent_source_writer) | test(test_centroid_missing_state_rebuilds_or_stays_unbound) | test(test_centroid_source_ahead_fallback_is_reported) | test(test_centroid_repeated_large_rewrites_do_not_rebase_every_refresh) | test(test_centroid_opt_in_applies_and_falls_back_after_corruption) | test(test_centroid_randomized_refresh_churn_matches_native_avg) | test(test_centroid_initialization_query_preserves_nulls_and_join_multiplicity) | test(test_vector_centroid_rescan_matches_native_avg_under_sustained_churn) | test(test_vector_centroid_rescan_preserves_join_multiplicity_and_rollback) | test(test_pgvector_hnsw_index_on_stream_table) | test(test_vector_diagnostics_catalog_visibility_and_index_metadata) | test(test_distance_subscription_typed_predicates_and_authorization) | test(test_pgvector_halfvec_avg_output_type) | test(test_embedding_stream_table_halfvec_and_sparsevec_indexes) | test(test_wide_vectors_refresh_without_oversized_covering_index) | test(test_manual_concurrent_ann_rebuild_allows_reads_and_refresh_writes) | test(test_ann_worker_rebuilds_only_the_requested_partition_leaf) | test(test_ann_maintenance_claim_is_session_bound_and_retryable) | test(test_tenant_tutorial_sql_runs_with_isolated_reader) | test(test_hybrid_candidates_refresh_and_tenant_isolation) | test(test_partitioned_corpus_parent_rls_and_leaf_privileges) | test(test_revision_safe_generation_and_model_rollover) | test(test_revision_safe_publication_enqueues_missing_work_without_duplicates) | test(test_model_cutover_holds_source_lock_and_rolls_back) | test(test_revision_safe_rechunk_rejects_inflight_results)'
