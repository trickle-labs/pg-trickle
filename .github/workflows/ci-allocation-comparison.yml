name: PR allocation comparison

on:
  workflow_call:

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci
  NEXTEST_RETRIES: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  PGS_E2E_IMAGE: pg_trickle_e2e:latest

jobs:
  prepare:
    name: Comparison inputs
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify frozen production and test sources
        run: git diff --exit-code 0cbd84dce4fede39fa36f2c8716e0faa0a9b1b14 -- src tests verification Cargo.toml Cargo.lock pg_trickle.control
      - name: Free runner space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - name: Read the builder image from GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the single extension candidate
        env:
          BUILDER_IMAGE: ghcr.io/trickle-labs/pg-trickle/builder:pg18
        run: |
          docker pull "$BUILDER_IMAGE"
          ./tests/build_e2e_image.sh
          docker pull postgres:18.6
          docker pull postgres:18.6-alpine
      - name: Freeze images and extract the candidate package
        run: |
          mkdir -p comparison-inputs/package/usr/lib/postgresql/18/lib comparison-inputs/package/usr/share/postgresql/18/extension
          docker save pg_trickle_e2e:latest postgres:18.6 postgres:18.6-alpine --output comparison-inputs/images.tar
          candidate=$(docker create pg_trickle_e2e:latest)
          docker cp "$candidate:/usr/lib/postgresql/18/lib/pg_trickle.so" comparison-inputs/package/usr/lib/postgresql/18/lib/
          docker cp "$candidate:/usr/share/postgresql/18/extension/." comparison-inputs/package/usr/share/postgresql/18/extension/
          docker rm "$candidate"
          find comparison-inputs/package/usr/share/postgresql/18/extension -type f ! -name 'pg_trickle*' -delete
          docker image inspect pg_trickle_e2e:latest postgres:18.6 postgres:18.6-alpine > comparison-inputs/images.json
          cd comparison-inputs
          find package -type f -print0 | sort -z | xargs -0 sha256sum > package.sha256
          sha256sum images.tar > images.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: allocation-inputs
          path: comparison-inputs/
          compression-level: 1
          if-no-files-found: error
          retention-days: 14

  replay:
    name: Replay (${{ matrix.allocation }}, ${{ matrix.tier }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        allocation: [before, after]
        tier: [integration, light-1, light-2, light-3, full]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify frozen production and test sources
        run: git diff --exit-code 0cbd84dce4fede39fa36f2c8716e0faa0a9b1b14 -- src tests verification Cargo.toml Cargo.lock pg_trickle.control
      - name: Free runner space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - name: Set up matching cold build environments
        uses: ./.github/actions/setup-pgrx
        with:
          rust-toolchain: '1.99.1'
          cache: 'false'
      - uses: actions/download-artifact@v8
        with:
          name: allocation-inputs
          path: comparison-inputs
      - name: Verify and load identical inputs
        run: |
          cd comparison-inputs
          sha256sum -c package.sha256
          sha256sum -c images.sha256
          docker load --input images.tar
      - name: Record environment and run the allocation
        env:
          ALLOCATION: ${{ matrix.allocation }}
          TIER: ${{ matrix.tier }}
          PGT_EXTENSION_DIR: ${{ github.workspace }}/comparison-inputs/package
        run: python3 scripts/run_ci_allocation.py "$ALLOCATION" "$TIER"
      - name: Retain every attempt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-${{ matrix.allocation }}-${{ matrix.tier }}
          path: target/allocation-comparison/
          if-no-files-found: warn
          retention-days: 14
