name: Issue 1411 isolated validation

on:
  push:
    branches: [work/issue-1411-recursive-validation]
    paths:
      - .github/workflows/issue-1411-validation.yml
      - scripts/issue_1411_apply.py

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Archive source and test harness for isolated editing
        run: git ls-files -z | tar -czf /tmp/issue-1411-source.tar.gz --null -T -
      - uses: actions/upload-artifact@v7
        with:
          name: issue-1411-source
          path: /tmp/issue-1411-source.tar.gz
          retention-days: 1
