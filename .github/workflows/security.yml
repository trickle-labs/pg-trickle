# =============================================================================
# Security Audit — free for public repositories.
#
# Runs cargo-audit to check all Cargo dependencies against the RustSec
# Advisory Database (https://rustsec.org/) for known CVEs.
#
# Results are posted as PR check annotations via rustsec/audit-check.
#
# Runs on: pushes to main that touch dependencies, every PR, and weekly.
# =============================================================================
name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    # Weekly on Monday at 08:00 UTC — catches newly published advisories
    - cron: "0 8 * * 1"
  workflow_dispatch:  # Allow manual runs from the Actions tab

jobs:
  audit:
    if: github.event_name != 'schedule'
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write  # rustsec/audit-check posts results as a GitHub Check Run
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SEC-001: Advisory ignores are centralized in deny.toml.
          # This list must stay in sync with the [advisories] ignore list in deny.toml.
          # See deny.toml for the rationale comment on each advisory.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0104,RUSTSEC-2026-0118,RUSTSEC-2026-0119,RUSTSEC-2026-0120

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny (advisory check via deny.toml)
        # SEC-001: cargo deny reads deny.toml as the single source of truth
        # for advisory ignores. This step confirms deny.toml and cargo-audit
        # ignores stay in sync.
        run: cargo deny check advisories

  audit-scheduled:
    if: github.event_name == 'schedule'
    name: cargo audit (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write  # scheduled rustsec/audit-check runs open issues for new advisories
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071: rsa Marvin Attack — pulled in transitively via
          # sqlx -> sqlx-mysql -> rsa, but pg_trickle only uses the "postgres"
          # feature of sqlx. sqlx-mysql is never compiled into the extension.
          # Suppress until an upstream fix is available.
          # RUSTSEC-2026-0104: rustls-webpki reachable panic in CRL parsing.
          # Pulled in transitively via ureq (dev/test path). We do not parse CRLs.
          # Will be resolved when upstream updates to >=0.103.13.
          # RUSTSEC-2026-0118, RUSTSEC-2026-0119, RUSTSEC-2026-0120: hickory-dns DoS advisories
          # published 2026-05-01 affecting hickory-proto 0.26.0 and hickory-net 0.26.0 (NSEC3
          # unbounded loop and O(n²) name compression). These crates are only transitive test
          # dependencies via sqlx's integration tests and are not reachable in the extension.
          # Will be resolved when upstream releases hickory-dns 0.26.1.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0104,RUSTSEC-2026-0118,RUSTSEC-2026-0119,RUSTSEC-2026-0120
