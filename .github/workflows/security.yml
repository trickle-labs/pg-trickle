# =============================================================================
# Security Audit — free for public repositories.
#
# Runs cargo-audit to check all Cargo dependencies against the RustSec
# Advisory Database (https://rustsec.org/) for known CVEs.
#
# Results are posted as PR check annotations via rustsec/audit-check.
#
# Runs on: pushes to main that touch dependencies, every PR, and weekly.
# =============================================================================
name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
  schedule:
    # Weekly on Monday at 08:00 UTC — catches newly published advisories
    - cron: "0 8 * * 1"
  workflow_dispatch:  # Allow manual runs from the Actions tab

jobs:
  audit:
    if: github.event_name != 'schedule'
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write  # rustsec/audit-check posts results as a GitHub Check Run
    steps:
      - uses: actions/checkout@v7

      - name: Reject active SQLite dependency
        shell: bash
        run: |
          set -o pipefail
          cargo tree --locked --workspace --all-features --target all --edges normal,build,dev --prefix none --format '{p}' |
            awk '/^libsqlite3-sys v/ { found = 1 } END { exit found }'

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # shortcut: SQLx 0.9 locks an unused SQLite; remove this exception when a patched SQLx is available.
          # The preceding graph check rejects active SQLite; cargo-deny does not ignore this advisory.
          ignore: RUSTSEC-2021-0127,RUSTSEC-2026-0459

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny (advisory check via deny.toml)
        # Unlike cargo-audit, cargo-deny checks the selected dependency graph.
        run: cargo deny check advisories

  audit-scheduled:
    if: github.event_name == 'schedule'
    name: cargo audit (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write  # scheduled rustsec/audit-check runs open issues for new advisories
    steps:
      - uses: actions/checkout@v7

      - name: Reject active SQLite dependency
        shell: bash
        run: |
          set -o pipefail
          cargo tree --locked --workspace --all-features --target all --edges normal,build,dev --prefix none --format '{p}' |
            awk '/^libsqlite3-sys v/ { found = 1 } END { exit found }'

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # shortcut: SQLx 0.9 locks an unused SQLite; remove this exception when a patched SQLx is available.
          # The preceding graph check rejects active SQLite.
          ignore: RUSTSEC-2021-0127,RUSTSEC-2026-0459
