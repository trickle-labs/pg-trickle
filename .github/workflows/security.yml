# =============================================================================
# Security Audit — free for public repositories.
#
# Runs cargo-audit to check all Cargo dependencies against the RustSec
# Advisory Database (https://rustsec.org/) for known CVEs.
#
# Results are posted as PR check annotations via rustsec/audit-check.
#
# Runs on: pushes to main that touch dependencies, every PR, and weekly.
# =============================================================================
name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
      - "deny.toml"
      - "scripts/check_deny_expiry.py"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
      - "deny.toml"
      - "scripts/check_deny_expiry.py"
  schedule:
    # Weekly on Monday at 08:00 UTC — catches newly published advisories
    - cron: "0 8 * * 1"
  workflow_dispatch:  # Allow manual runs from the Actions tab

jobs:
  audit:
    if: github.event_name != 'schedule'
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write  # rustsec/audit-check posts results as a GitHub Check Run
    steps:
      - uses: actions/checkout@v7

      - name: Reject active SQLite or Chrono dependencies
        shell: bash
        run: |
          set -o pipefail
          cargo tree --locked --workspace --all-features --target all --edges normal,build,dev --prefix none --format '{p}' |
            awk '/^(libsqlite3-sys|chrono) v/ { print "Unexpected active dependency: " $0; found = 1 } END { exit found }'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate and export reviewed advisory exceptions
        id: advisory-policy
        shell: bash
        run: |
          set -euo pipefail
          ignores="$(python3 scripts/check_deny_expiry.py --audit-ignores)"
          printf 'ignore=%s\n' "$ignores" >> "$GITHUB_OUTPUT"

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SEC-001: Read the same time-limited advisory exceptions as cargo-deny.
          ignore: ${{ steps.advisory-policy.outputs.ignore }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny (advisory check via deny.toml)
        # Unlike cargo-audit, cargo-deny checks the selected dependency graph.
        run: cargo deny check advisories

  audit-scheduled:
    if: github.event_name == 'schedule'
    name: cargo audit (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write  # scheduled rustsec/audit-check runs open issues for new advisories
    steps:
      - uses: actions/checkout@v7

      - name: Reject active SQLite or Chrono dependencies
        shell: bash
        run: |
          set -o pipefail
          cargo tree --locked --workspace --all-features --target all --edges normal,build,dev --prefix none --format '{p}' |
            awk '/^(libsqlite3-sys|chrono) v/ { print "Unexpected active dependency: " $0; found = 1 } END { exit found }'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate and export reviewed advisory exceptions
        id: advisory-policy
        shell: bash
        run: |
          set -euo pipefail
          ignores="$(python3 scripts/check_deny_expiry.py --audit-ignores)"
          printf 'ignore=%s\n' "$ignores" >> "$GITHUB_OUTPUT"

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SEC-001: Read the same time-limited advisory exceptions as cargo-deny.
          ignore: ${{ steps.advisory-policy.outputs.ignore }}
