# Unclassified files retain runtime coverage; exclusions select cheaper checks.
# Used with paths-filter's some-with-excludes predicate.
runtime:
  - '**'
  - '!**/*.md'
  - '!openwiki/**'
  - '!.openwikiignore'
  - '!.agents/skills/openwiki/**'
  - '!.codex/config.toml'
  - '!docs/**'
  - '!scripts/**'
  - '!benchmarks/**'
  - '!benches/**'
  - '!cnpg/**'
  - '!docker/**'
  - '!monitoring/**'
  - '!demo/**'
  - '!demos/**'
  - '!examples/**'
  - '!playground/**'
  - '!blog/**'
  - '!plans/**'
  - '!adrs/**'
  - '!dbt-pgtrickle/**'
  - '!tests/release/**'
  - '!.github/**'
  - '!LICENSE'
  - '!.gitignore'
  - '!book.toml'
  - '!codecov.yml'
  - '!deny.toml'
  - '!META.json'
  - '!justfile'
  - '!Dockerfile.demo'
  - '!Dockerfile.ghcr'

# These scripts and CI definitions affect compiled tests or candidate identity.
harness:
  - 'scripts/pg_stub.c'
  - 'scripts/gen_test_schema.py'
  - 'scripts/run_*'
  - '!scripts/run_benchmarks.sh'
  - 'scripts/release_install_attestation.py'
  - 'scripts/check_lsn_verification.py'
  - 'scripts/check_lsn_candidate_binding.py'
  - '.github/actions/**'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'
  - '.github/ci-suites.json'
  - 'scripts/ci_pr_suite.py'
  - '!**/*.md'

benchmarks:
  - 'benches/**'
  - 'benchmarks/**'
  - '!**/*.md'
  - 'scripts/run_benchmarks.sh'
  - 'scripts/criterion_regression_check.py'
  - '.github/workflows/benchmarks.yml'

shipping:
  - 'Dockerfile.ghcr'
  - '.dockerignore'
  - 'docker/pg_trickle-defaults.conf'

monitoring:
  - 'monitoring/**'
  - '!**/*.md'
  - 'src/otel.rs'
  - 'scripts/check_monitoring_contract.py'

getting_started:
  - 'examples/dbt_getting_started/**'
  - 'dbt-pgtrickle/**'
  - '!**/*.md'

# Sensitive checks share the static-contract selector; avoid a second queued job.
failure_recovery_changed:
  - '.github/ci-paths.yml'
  - 'src/refresh/**'
  - 'src/cdc/**'
  - 'src/ivm.rs'
  - 'sql/*.sql'
  - 'src/api/refresh_ops.rs'
  - 'src/config/scheduler.rs'
  - 'src/scheduler/**'
  - 'tests/e2e_failure_recovery_tests.rs'
  - 'tests/e2e_refresh_atomicity_tests.rs'
  - 'tests/e2e_dvm_failpoint_tests.rs'
  - 'tests/e2e_cleanup_chaos_tests.rs'
  - 'scripts/run_failure_recovery_repetition.sh'
  - '.github/workflows/ci.yml'
  - '.github/ci-suites.json'
  - 'scripts/ci_pr_suite.py'
unsafe_boundary_changed:
  - '.github/ci-paths.yml'
  - 'Cargo.toml'
  - 'src/error.rs'
  - 'src/refresh/pipeline.rs'
  - 'src/api/security_context.rs'
  - 'src/api/refresh_ops.rs'
  - 'src/api/outbox.rs'
  - 'src/scheduler/dispatch.rs'
  - 'tests/e2e_unsafe_boundary_tests.rs'
  - 'tests/e2e/mod.rs'
  - 'tests/Dockerfile.e2e-asan'
  - 'tests/fixtures/asan_probe.c'
  - 'tests/fixtures/asan_pg18_leak.supp'
  - 'tests/fixtures/initdb-asan-wrapper.sh'
  - '.github/workflows/ci.yml'
